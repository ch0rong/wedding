<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f7f7">
  <title>서태평 ♥ 박규민 결혼합니다</title>
  <meta name="description" content="2027년 1월 16일 토요일 오후 1시 10분, 그랜드하우스 웨딩홀 7층 엘리나 홀">

  <!-- 카카오톡/문자 공유 미리보기 (JS가 실행되지 않으므로 직접 수정) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="서태평 ♥ 박규민 결혼합니다">
  <meta property="og:description" content="2027년 1월 16일 토요일 오후 1시 10분 · 그랜드하우스 웨딩홀 7층 엘리나 홀">
  <meta property="og:image" content="https://picsum.photos/seed/wedding-main/1200/630">

  <!-- 브라우저 탭 아이콘 (웨딩링) -->
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=202610271558">
</head>
<body>
  <!-- 배경음악 토글 (화면 우측 상단 고정) -->
  <button type="button" class="music-btn" id="music-toggle" aria-pressed="false" aria-label="배경음악 켜기">
    <svg class="music-btn__icon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M9 18V5l12-2v13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="6" cy="18" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/>
      <circle cx="18" cy="16" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/>
      <line class="music-btn__slash" x1="3" y1="3" x2="21" y2="21" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    </svg>
  </button>

  <main class="page" id="page">
    <!-- 1. 메인 비주얼 -->
    <section class="section section--hero" id="hero"><div data-mount></div></section>

    <!-- 2. 모시는 글 -->
    <section class="section" id="greeting">
      <header class="section-head"><p class="section-head__en">Invitation</p><h2 class="section-head__ko">초대합니다</h2></header>
      <div data-mount></div>
    </section>

    <!-- 3. 달력 / 디데이 -->
    <section class="section" id="calendar">
      <header class="section-head"><p class="section-head__en">Wedding Day</p><h2 class="section-head__ko">예식 일시</h2></header>
      <div data-mount></div>
    </section>

    <!-- 4. 오시는 길 -->
    <section class="section" id="location">
      <header class="section-head"><p class="section-head__en">Location</p><h2 class="section-head__ko">오시는 길</h2></header>
      <div data-mount></div>
    </section>

    <!-- 5. 사진첩 -->
    <section class="section" id="gallery">
      <header class="section-head"><p class="section-head__en">Gallery</p><h2 class="section-head__ko">사진첩</h2></header>
      <div data-mount></div>
    </section>

    <!-- 6. 마음 전하기 -->
    <section class="section" id="account">
      <header class="section-head"><p class="section-head__en">With Heart</p><h2 class="section-head__ko">마음 전하실 곳</h2></header>
      <div data-mount></div>
    </section>

    <!-- 7. 방명록 -->
    <section class="section" id="guestbook">
      <header class="section-head"><p class="section-head__en">Guestbook</p><h2 class="section-head__ko">방명록</h2></header>
      <div data-mount></div>
    </section>

    <!-- 8. 푸터 -->
    <footer class="section section--footer" id="footer"><div data-mount></div></footer>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="modal" id="modal" hidden></div>
  <div class="lightbox" id="lightbox" hidden></div>

  <script>
    // 파일을 더블클릭해서 열면(file://) 브라우저가 JS 모듈을 막아 화면이 비어 보이므로 안내
    if (location.protocol === 'file:') {
      document.getElementById('page').innerHTML =
        '<div class="file-warning"><b>미리보기 방법 안내</b>' +
        '<p>index.html을 더블클릭하면 브라우저 보안 정책 때문에 화면이 표시되지 않습니다.</p>' +
        '<p>폴더 안의 <b>start.bat</b>을 더블클릭해서 열어 주세요.<br>(GitHub Pages에 올리면 정상적으로 보입니다)</p></div>';
    }
  </script>
  <!-- 카카오맵 '지도 퍼가기' 로더: document.write를 쓰므로 모듈보다 먼저, 일반 script 태그로 불러와야 함 -->
  <script charset="UTF-8" class="daum_roughmap_loader_script" src="https://t1.kakaocdn.net/kakaomapweb/roughmap/loader/prod/roughmapLoader.js"></script>
  <script type="module" src="js/app.js?v=202610271558"></script>
</body>
</html>
